# nginx site for a server that already runs nginx.
# 1. Copy to /etc/nginx/sites-available/<your-domain>, replace the domain below.
# 2. ln -s /etc/nginx/sites-available/<your-domain> /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d <your-domain>     (adds HTTPS and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name marketing.staging.ashniva.com;

    # Creative uploads (images and videos) can be large.
    client_max_body_size 200m;

    location / {
        # WEB_PORT in .env (default 3100)
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
